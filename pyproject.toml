[project]
name = "linker-sim-viser"
version = "0.1.0"
description = "Browser-based, physics-free replay viewer for LinkerBot dual-arm + dexterous-hand data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "viser[urdf]>=1.0.20",
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linker_sim_viser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
