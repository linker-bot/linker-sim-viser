[project]
name = "linker-sim-viser"
version = "0.1.0"
description = "Browser-based, physics-free replay viewer for LinkerBot dual-arm + dexterous-hand data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "viser[urdf]>=1.0.20",
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
    "linker-robot-assets",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# UMI-Dex mcap ingest + offline IK retargeting (scripts/umi_mcap_to_episode.py).
# Not needed to run the viewer on already-converted episodes.
umi = [
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "scipy>=1.11",
]

[tool.uv.sources]
# Authoritative robot assets + hand decoders live in the sibling linker-sim
# checkout. Editable path install so asset_root() resolves to its live
# (git-lfs-pulled) full-res assets — single source of truth, no drift.
linker-robot-assets = { path = "../linker-sim/packages/linker-robot-assets", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linker_sim_viser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
