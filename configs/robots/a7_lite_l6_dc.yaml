# a7_lite dual-arm + LinkerHand L6 workstation.
# The URDF path points at the vendored testing bundle in `assets/`. That
# bundle is a copy of a snapshot of
#   linker-sim/packages/linker-robot-assets/src/linker_robot_assets/assets/
# for the a7_lite_l6_dc workstation only, so the colleague can test this
# viewer without the sibling `linker-sim/` checkout. Once
# `linker-robot-assets` ships as an installable package, delete the
# `assets/` tree and swap this line for a package lookup.

urdf_path: ../../assets/workstations/a7_lite_l6_dc/workstation.urdf

# Streams map npz slices to URDF joints. `joints` order is authoritative:
# column i of the sliced array is written to `joints[i]`. Hand streams carry
# SDK 0-255 raw; the decoder linearly maps 0-255 -> 0-100 -> URDF radians.
#
# SDK hand column order (per the collection team, 2026-07-07):
#   0 thumb_pitch  1 thumb_yaw (== URDF thumb_cmc_roll)
#   2 index_pitch  3 middle_pitch  4 ring_pitch  5 pinky_pitch
streams:
  - key: qpos
    slice: [0, 7]
    joints:
      - arm_left_L1_Joint
      - arm_left_L2_Joint
      - arm_left_L3_Joint
      - arm_left_L4_Joint
      - arm_left_L5_Joint
      - arm_left_L6_Joint
      - arm_left_L7_Joint

  - key: qpos
    slice: [7, 14]
    joints:
      - arm_right_R1_Joint
      - arm_right_R2_Joint
      - arm_right_R3_Joint
      - arm_right_R4_Joint
      - arm_right_R5_Joint
      - arm_right_R6_Joint
      - arm_right_R7_Joint

  - key: qpos
    slice: [14, 20]
    joints:
      - hand_left_lh_thumb_cmc_pitch
      - hand_left_lh_thumb_cmc_roll
      - hand_left_lh_index_mcp_pitch
      - hand_left_lh_middle_mcp_pitch
      - hand_left_lh_ring_mcp_pitch
      - hand_left_lh_pinky_mcp_pitch
    decoder: {kind: linkerhand_l6, side: left, sdk_range: [0, 255]}

  - key: qpos
    slice: [20, 26]
    joints:
      - hand_right_rh_thumb_cmc_pitch
      - hand_right_rh_thumb_cmc_roll
      - hand_right_rh_index_mcp_pitch
      - hand_right_rh_middle_mcp_pitch
      - hand_right_rh_ring_mcp_pitch
      - hand_right_rh_pinky_mcp_pitch
    decoder: {kind: linkerhand_l6, side: right, sdk_range: [0, 255]}

ee_frames:
  - {label: left_tcp,  link: hand_left_lh_hand_base_link,   color: [80, 140, 220]}
  - {label: right_tcp, link: hand_right_rh_hand_base_link,  color: [230, 130, 60]}
