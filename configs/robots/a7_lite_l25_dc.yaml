# a7_lite dual-arm + LinkerHand L25 workstation (16 actuated / hand).
# URDF + meshes load from the installed linker-robot-assets package (single
# source of truth); `pkg://` resolves against its asset_root().
#
# One hand, three names: G20 (SDK), L20 (data collection), L25 (these assets).
# Its SDK puts a 20-slot vector on the wire per hand, four of them reserved,
# and the collection pipeline stores that packet verbatim — so each hand block
# is 20 columns and qpos is 7+7+20+20 = 54 wide. `slots: raw` says so; the
# width comes from the hand's declared SDK layout, and decode_hand drops the
# reserved slots. Do not hand-write hand widths here (issues #7, #9).
urdf_path: pkg://workstations/a7_lite_l25_dc/workstation.urdf

# Arm streams: npz slice columns map positionally to `joints`.
# Hand streams: `offset` is the block's first column (SDK channel order,
# 0-255); decode_hand rescales to 0-100 and reorders SDK->URDF, so `joints`
# is the URDF hand actuated-joint document order (== manifest joints[role]).
streams:
  - key: qpos
    slice: [0, 7]
    joints:
      - arm_left_L1_Joint
      - arm_left_L2_Joint
      - arm_left_L3_Joint
      - arm_left_L4_Joint
      - arm_left_L5_Joint
      - arm_left_L6_Joint
      - arm_left_L7_Joint

  - key: qpos
    slice: [7, 14]
    joints:
      - arm_right_R1_Joint
      - arm_right_R2_Joint
      - arm_right_R3_Joint
      - arm_right_R4_Joint
      - arm_right_R5_Joint
      - arm_right_R6_Joint
      - arm_right_R7_Joint

  - key: qpos
    offset: 14
    joints:
      - hand_left_lh_thumb_cmc_roll
      - hand_left_lh_thumb_cmc_yaw
      - hand_left_lh_thumb_cmc_pitch
      - hand_left_lh_thumb_mcp
      - hand_left_lh_index_mcp_roll
      - hand_left_lh_index_mcp_pitch
      - hand_left_lh_index_pip
      - hand_left_lh_middle_mcp_roll
      - hand_left_lh_middle_mcp_pitch
      - hand_left_lh_middle_pip
      - hand_left_lh_ring_mcp_roll
      - hand_left_lh_ring_mcp_pitch
      - hand_left_lh_ring_pip
      - hand_left_lh_pinky_mcp_roll
      - hand_left_lh_pinky_mcp_pitch
      - hand_left_lh_pinky_pip
    decoder: {kind: linkerhand_l25, side: left, sdk_range: [0, 255], slots: raw}

  - key: qpos
    offset: 34
    joints:
      - hand_right_rh_thumb_cmc_roll
      - hand_right_rh_thumb_cmc_yaw
      - hand_right_rh_thumb_cmc_pitch
      - hand_right_rh_thumb_mcp
      - hand_right_rh_index_mcp_roll
      - hand_right_rh_index_mcp_pitch
      - hand_right_rh_index_pip
      - hand_right_rh_middle_mcp_roll
      - hand_right_rh_middle_mcp_pitch
      - hand_right_rh_middle_pip
      - hand_right_rh_ring_mcp_roll
      - hand_right_rh_ring_mcp_pitch
      - hand_right_rh_ring_pip
      - hand_right_rh_pinky_mcp_roll
      - hand_right_rh_pinky_mcp_pitch
      - hand_right_rh_pinky_pip
    decoder: {kind: linkerhand_l25, side: right, sdk_range: [0, 255], slots: raw}

ee_frames:
  - {label: left_tcp,  link: hand_left_lh_hand_base_link,   color: [80, 140, 220]}
  - {label: right_tcp, link: hand_right_rh_hand_base_link,  color: [230, 130, 60]}
